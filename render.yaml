services:
  - type: web
    name: requisition-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://requisition-frontend.onrender.com
      - key: PORT
        value: 5000
    disk:
      name: requisition-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  - type: web
    name: requisition-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://requisition-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
